<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account access — HoneyChain</title>
<link rel="icon" type="image/png" href="/src/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/landing/style.css">
<link rel="stylesheet" href="/assets/auth/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="site-nav">
  <div class="container">
    <a href="/" class="brand">
      <img src="/src/images/logo.png" alt="HoneyChain logo" class="brand-logo">
      HoneyChain
    </a>
    <a href="/" class="nav-cta">Back home</a>
  </div>
</nav>

<main class="auth-shell">
  <section class="auth-card" aria-labelledby="auth-title">
    <span class="eyebrow-tag"><span class="dot"></span> HoneyChain account</span>
    <h1 id="auth-title">Your hive, one trusted sign-in.</h1>
    <p class="auth-intro">Use your HoneyChain admin credentials to enter the beekeeper workspace.</p>
    <form class="credentials-form" action="/api/auth/login" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="google-button" type="submit">Enter HoneyChain</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <button id="google-sign-in" class="google-button google-oauth-button" type="button">Continue with Google</button>
    <p id="google-status" class="auth-status" role="status"></p>
    <p class="auth-note">Only the authorized HoneyChain admin account can enter this workspace.</p>
  </section>
</main>
<script src="/assets/auth/auth.js"></script>
</body>
</html>
