<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account access — HoneyChain</title>
<link rel="icon" type="image/png" href="/src/images/logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/landing/style.css">
<link rel="stylesheet" href="/assets/auth/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const oauthCallback = window.location.hash.includes('access_token') || new URLSearchParams(window.location.search).has('code');
  if (oauthCallback) document.documentElement.classList.add('oauth-callback-pending');
</script>
</head>
<body>
<nav class="site-nav">
  <div class="container">
    <a href="/" class="brand">
      <img src="/src/images/logo.png?v=2" alt="HoneyChain logo" class="brand-logo">
      HoneyChain
    </a>
    <a href="/" class="nav-cta">Back home</a>
  </div>
</nav>

<main class="auth-shell">
  <section class="modal-box auth-modal-box" aria-labelledby="auth-title">
    <a href="/" class="auth-modal-close" aria-label="Close login and return home">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </a>

    <h1 id="auth-title" class="auth-modal-title">Login to Honey Chain</h1>
    <p class="auth-modal-subtitle">Access your apiary telemetry dashboard or verified batch reports.</p>

    <form id="login-form" class="auth-modal-form">
      <div class="auth-modal-field">
        <label for="login-email">Email Address</label>
        <input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@apiary.com" class="batch-input" required>
      </div>

      <div class="auth-modal-field">
        <label for="login-password">Password</label>
        <div class="password-input-wrap">
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" class="batch-input" required>
          <button id="password-visibility-toggle" class="password-visibility-toggle" type="button" aria-label="Show password" aria-controls="login-password" aria-pressed="false" title="Show password">
            <svg class="password-eye-visible" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="password-eye-hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16 16 0 0 1-3.1 3.8"></path><path d="M6.2 6.2A16 16 0 0 0 2.5 12s3.5 7 9.5 7a10.8 10.8 0 0 0 3.2-.5"></path></svg>
          </button>
        </div>
      </div>

      <button id="login-submit" class="btn btn-primary auth-modal-submit" type="submit">Sign In</button>
    </form>

    <p id="login-status" class="auth-status auth-modal-status" role="status" aria-live="polite"></p>
    <div class="login-divider">
      <span>or continue with</span>
    </div>
    <button id="google-sign-in" class="gsi-material-button" type="button">
      <div class="gsi-material-button-state"></div>
      <div class="gsi-material-button-content-wrapper">
        <div class="gsi-material-button-icon">
          <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            <path fill="none" d="M0 0h48v48H0z"></path>
          </svg>
        </div>
        <span class="gsi-material-button-contents">Continue with Google</span>
        <span style="display: none;">Continue with Google</span>
      </div>
    </button>
    <p id="google-status" class="auth-status auth-modal-status" role="status" aria-live="polite"></p>

    <div class="auth-modal-switch">
      <span>Don't have an account?</span>
      <a href="/onboarding">Register here</a>
    </div>
  </section>
</main>
<script src="/assets/auth/auth.js?v=2"></script>
</body>
</html>
