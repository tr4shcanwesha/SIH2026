<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account access — HoneyChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/home/style.css">
<link rel="stylesheet" href="/assets/auth/style.css">
</head>
<body>
<nav class="site-nav">
  <div class="container">
    <a href="/" class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="var(--gold-600)" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 2V22M3 7L12 12M21 7L12 12M3 17L12 12M21 17L12 12" stroke="var(--gold-500)" stroke-width="1" opacity="0.5"/></svg>
      HoneyChain
    </a>
    <a href="/" class="nav-cta">Back home</a>
  </div>
</nav>

<main class="auth-shell">
  <section class="auth-card" aria-labelledby="auth-title">
    <span class="eyebrow-tag"><span class="dot"></span> HoneyChain account</span>
    <h1 id="auth-title">Your hive, one trusted sign-in.</h1>
    <p class="auth-intro">Use your HoneyChain admin credentials to enter the beekeeper workspace.</p>
    <form class="credentials-form" action="/api/auth/login" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="google-button" type="submit">Enter HoneyChain</button>
    </form>
    <p class="auth-note">Only the authorized HoneyChain admin account can enter this workspace.</p>
  </section>
</main>
</body>
</html>
