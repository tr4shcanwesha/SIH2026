<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account access — HoneyChain</title>
<link rel="icon" type="image/png" href="/src/images/logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/landing/style.css">
<link rel="stylesheet" href="/assets/auth/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const oauthCallback = window.location.hash.includes('access_token') || new URLSearchParams(window.location.search).has('code');
  if (oauthCallback) document.documentElement.classList.add('oauth-callback-pending');
</script>
</head>
<body>
<nav class="site-nav">
  <div class="container">
    <a href="/" class="brand">
      <img src="/src/images/logo.png?v=2" alt="HoneyChain logo" class="brand-logo">
      HoneyChain
    </a>
    <a href="/" class="nav-cta">Back home</a>
  </div>
</nav>

<main class="auth-shell">
  <section class="auth-card" aria-labelledby="auth-title">
    <span class="eyebrow-tag"><span class="dot"></span> HoneyChain account</span>
    <h1 id="auth-title">Your hive, one trusted sign-in.</h1>
    <p class="auth-intro">Sign in securely with your Google account to enter the beekeeper workspace.</p>
    <button id="google-sign-in" class="google-button google-oauth-button" type="button">Continue with Google</button>
    <p id="google-status" class="auth-status" role="status"></p>
    <p class="auth-note">Only the authorized HoneyChain admin account can enter this workspace.</p>
  </section>
</main>
<script src="/assets/auth/auth.js"></script>
</body>
</html>
