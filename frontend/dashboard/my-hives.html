<div class="dash-top hive-page-top">
  <div><h2>My hives</h2><p id="hive-summary" style="margin:0; color:var(--ink-soft); font-size:0.92rem;">Loading your hives...</p></div>
  <button class="nav-cta add-hive-button" type="button" id="open-add-hive">Add hive</button>
</div>

<div class="hive-tools">
  <label class="hive-search"><span>Search hives</span><input id="hive-search-input" type="search" placeholder="Search by ID, location, or species"></label>
</div>

<form class="add-hive-form" id="add-hive-form" hidden>
  <div class="add-hive-fields">
    <label>Location<input name="location" required></label>
    <label>Bee species<input name="bee_species" required></label>
    <label>Hive type<input name="hive_type" required></label>
    <label>Installation date<input name="installation_date" type="date" required></label>
    <label>Status<select name="status"><option>Healthy</option><option>Needs check</option><option>Inactive</option></select></label>
  </div>
  <div class="add-hive-actions"><button class="nav-cta" type="submit">Save hive</button><button class="plain-button" type="button" id="cancel-add-hive">Cancel</button></div>
  <p class="hive-form-status" id="hive-form-status" role="status"></p>
</form>

<div class="hive-list" id="hive-list" aria-live="polite"></div>
